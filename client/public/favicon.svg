<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect x="0" y="0" width="32" height="32" rx="8" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Scanner beam / check emblem -->
  <g transform="translate(6, 6)">
    <!-- Rounded square outline -->
    <rect x="0" y="0" width="20" height="20" rx="5" fill="#ecfccb"/>
    <rect x="0.5" y="0.5" width="19" height="19" rx="4.5" fill="none" stroke="#84cc16" stroke-width="1.5"/>
    <!-- Scanner line -->
    <rect x="3" y="8" width="14" height="2" rx="1" fill="#84cc16"/>
    <!-- Check mark -->
    <path d="M5 13 L8.5 16.5 L15 10" fill="none" stroke="#65a30d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
